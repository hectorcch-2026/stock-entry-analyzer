# Render Blueprint —— 一鍵部署（Infrastructure as Code）
# 用法：把專案推到 GitHub → Render Dashboard → New → Blueprint → 選此 repo
# 文檔：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stock-entry-analyzer
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 以下各項 sync:false —— Render 會在首次部署時要求你手動填寫，
      # 不會被寫進 repo（等同 config.json 的作用）。
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # ---- LLM（DeepSeek）----
      # 程式讀取順序：環境變數 → config.json。
      # config.json 已列入 .gitignore，Render 讀不到，所以一定要用環境變數。
      #
      # 換成自己的供應商時，只要改這三個值，不必動程式。
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

      # 推理型模型（DeepSeek-V4.1-flash）會先產生 reasoning_content，
      # 且其 token 計入 max_tokens —— 實測推理量在 1340–6167 之間波動，
      # 會把正文擠成空字串。本專案的 LLM 任務只是分類與改寫語氣，
      # 不需要推理，因此關閉思考；實測回應時間由 12–29 秒降到約 1–2 秒。
      #
      # 這兩個用 value 而非 sync:false：它們不是機密，且設錯會直接導致
      # 「有金鑰但輸出空白」這種極難排查的症狀，寫在 repo 裡反而安全。
      - key: LLM_DISABLE_THINKING
        value: "1"
      - key: LLM_MAX_TOKENS
        value: "3000"

      # ---- 推介追蹤帳本（每日精選推介追蹤）----
      # 這是全服務**唯一不能重算**的檔案：其他 data/ 底下都是快取，
      # 刪掉會自動重建；帳本刪掉就是歷史交易永久消失。
      #
      # Render 預設是 ephemeral filesystem，免費方案也沒有持久磁碟，
      # 每次部署、以及免費方案休眠（15 分鐘無流量）後重啟，
      # 容器都是全新的 —— 帳本會安靜地變回空的，且不會有錯誤訊息。
      # 因此：**要保留歷史，必須掛持久磁碟並把路徑指到掛載點**。
      #
      # 步驟：
      #   1. Dashboard → 本服務 → Disk → Add Disk
      #      Mount Path: /var/data    Size: 1 GB 起
      #   2. 把下面這行的註解拿掉（或直接在 Environment 設定同一個值）
      #   3. 重新部署；啟動日誌會印出「帳本位置」與是否持久可保存
      #
      # 未掛磁碟時程式仍可運作，只是每次重啟歸零；
      # 啟動日誌與 /api/tracker/status 都會標示 persistent:false 提醒。
      # - key: TRACKER_LEDGER_FILE
      #   value: /var/data/tracker/ledger.json

      # 每筆推介的本金（美元）。留空則用程式預設 10,000。
      # - key: TRACKER_CAPITAL_USD
      #   value: "10000"
