# Render Blueprint —— 一鍵部署（Infrastructure as Code）
# 用法：把專案推到 GitHub → Render Dashboard → New → Blueprint → 選此 repo
# 文檔：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stock-entry-analyzer
    runtime: node
    region: singapore
    branch: main
    # 刻意不寫 plan。
    #
    # Render 的文件寫明：省略 plan 時，「既有服務會保留目前的 compute 方案」。
    # 這正是我要的——把方案交給 Dashboard 決定，而不是由這個檔案猜。
    #
    # 為什麼不能留著舊的 `plan: free`：Blueprint 同步是以檔案為準，
    # 留著它就會把服務改回免費方案（連帶回到會休眠的狀態），
    # 而**持久磁碟只提供給付費的 web service**——一降級，磁碟就掛不上。
    #
    # 為什麼也不寫一個具體的 ID：Render 現在的方案是以 CPU/記憶體命名
    # （0.5c-512mb / 1c-2g / 2c-4g …），價格從 $7 到 $135/月不等。
    # 隨便填一個等於替使用者決定月費，填錯還會讓同步失敗。
    #
    # 註：Pro 是「workspace 方案」，與服務的 compute 方案是兩件事。
    #     磁碟要的是**這個服務**在付費方案上，請在 Dashboard 的
    #     Instance Type 確認服務本身不是 Free。
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true

    # ---- 持久磁碟 ----
    #
    # 為什麼掛在 data/ 整個目錄，而不是只掛帳本：
    #   · 帳本（data/tracker）是唯一不能重算的檔案，必須保留；
    #   · data/picks 是每日推介快照，tracker 靠它補跑歷史。
    #     若重啟後 picks 不見了，補跑就沒有素材，只能從當天重新開始。
    #     一起保留，重啟後歷史軌跡才連得起來。
    #   · 全部加起來現在只有 97KB，1GB 可以用非常久。
    #
    # 掛載點必須是 /opt/render/project/src 的**子目錄**
    # （Render 不允許掛在 /opt、/opt/render/project/src 本身）。
    # 掛在 data/ 的好處：程式預設的帳本路徑剛好就在裡面，
    # 不必為了掛載去改程式邏輯。
    #
    # sizeGB 取 1：文件建議「選目前能用的最小值」，而且之後只能增不能減。
    disk:
      name: tracker-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20"
      # 以下各項 sync:false —— Render 會在首次部署時要求你手動填寫，
      # 不會被寫進 repo（等同 config.json 的作用）。
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # ---- LLM（DeepSeek）----
      # 程式讀取順序：環境變數 → config.json。
      # config.json 已列入 .gitignore，Render 讀不到，所以一定要用環境變數。
      #
      # 換成自己的供應商時，只要改這三個值，不必動程式。
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false

      # 推理型模型（DeepSeek-V4.1-flash）會先產生 reasoning_content，
      # 且其 token 計入 max_tokens —— 實測推理量在 1340–6167 之間波動，
      # 會把正文擠成空字串。本專案的 LLM 任務只是分類與改寫語氣，
      # 不需要推理，因此關閉思考；實測回應時間由 12–29 秒降到約 1–2 秒。
      #
      # 這兩個用 value 而非 sync:false：它們不是機密，且設錯會直接導致
      # 「有金鑰但輸出空白」這種極難排查的症狀，寫在 repo 裡反而安全。
      - key: LLM_DISABLE_THINKING
        value: "1"
      - key: LLM_MAX_TOKENS
        value: "3000"

      # ---- 推介追蹤帳本（每日精選推介追蹤）----
      # 這是全服務**唯一不能重算**的檔案：其他 data/ 底下都是快取，
      # 刪掉會自動重建；帳本刪掉就是歷史交易永久消失。
      #
      # 上方已宣告 disk，掛載點是 /opt/render/project/src/data，
      # 而帳本預設就寫在 data/tracker/ledger.json —— 兩者自然對上，
      # 所以**不需要**再設 TRACKER_LEDGER_FILE。
      # 若之後想把帳本放到別處（例如多服務共用一顆磁碟），才需要覆寫。
      #
      # 如何確認真的生效（部署後看這兩處，不要只看程式有沒有報錯）：
      #   1. 啟動日誌應印出「帳本位置：/opt/render/project/src/data/tracker/ledger.json」
      #      **且不應**出現「⚠ 帳本可能無法長期保存」
      #   2. GET /api/tracker/status → ledger.persistent 應為 true
      # 這兩處同時為真，才代表資料真的活得過重新部署。
      #
      # 判斷依據是 st_dev：帳本目錄與程式根目錄若在不同裝置，
      # 代表它掛在一顆獨立磁碟上，那才會被保留。
      #
      # 注意：掛了磁碟後，重新部署期間會有數秒中斷（Render 必須先停舊實例
      # 才能掛載新磁碟，避免兩個版本同時寫同一顆碟），這是預期行為。
      # - key: TRACKER_LEDGER_FILE
      #   value: /var/data/tracker/ledger.json

      # 每筆推介的本金（美元）。留空則用程式預設 10,000。
      # - key: TRACKER_CAPITAL_USD
      #   value: "10000"
